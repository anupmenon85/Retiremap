<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>OptionFlow — Options Income Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #080d1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .card { background: #111827; border: 1px solid #1e2d45; border-radius: 14px; }
    /* Pills */
    .pill { border-radius: 20px; padding: 4px 11px; font-size: 12px; font-weight: 500;
            cursor: pointer; border: 1px solid transparent; transition: all 0.15s; white-space: nowrap; }
    .pill.active       { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .pill:not(.active) { background: #111827; color: #94a3b8; border-color: #1e2d45; }
    /* Segmented control */
    .seg-btn { padding: 4px 12px; font-size: 12px; font-weight: 500; cursor: pointer;
               background: transparent; color: #475569; border: 1px solid #1e2d45;
               transition: all 0.15s; white-space: nowrap; }
    .seg-btn:first-child      { border-radius: 8px 0 0 8px; }
    .seg-btn:last-child       { border-radius: 0 8px 8px 0; }
    .seg-btn:not(:first-child){ border-left: none; }
    .seg-btn.active           { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .seg-btn.active + .seg-btn{ border-left-color: #1d4ed8; }
    /* Chart tabs */
    .chart-tab { padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer;
                 border: none; background: none; color: #475569; border-bottom: 2px solid transparent;
                 transition: all 0.15s; }
    .chart-tab.active { color: #60a5fa; border-bottom-color: #3b82f6; }
    /* Stats */
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
                  color: #475569; margin-bottom: 4px; }
    .positive { color: #10b981; }
    .negative { color: #ef4444; }
    /* Table */
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #475569;
         padding: 9px 14px; text-align: left; border-bottom: 1px solid #1e2d45; }
    td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #0d1626; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #141e31; }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 5px; font-weight: 600; display: inline-block; }
    .b-green  { background: #052e1c; color: #10b981; }
    .b-blue   { background: #0c2044; color: #60a5fa; }
    .b-yellow { background: #2d1a02; color: #f59e0b; }
    .b-red    { background: #2d0a0a; color: #f87171; }
    .b-gray   { background: #1a2336; color: #94a3b8; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 4px; }
    /* Sync button */
    .sync-btn { background: #1d4ed8; color: white; border: none; padding: 6px 14px;
                border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
    .sync-btn:hover    { background: #2563eb; }
    .sync-btn:disabled { background: #1e3a6e; color: #4b6cb7; cursor: default; }
    /* Gear button */
    .gear-btn { background: #111827; color: #64748b; border: 1px solid #1e2d45;
                padding: 6px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: all 0.15s; }
    .gear-btn:hover { color: #94a3b8; border-color: #2d4060; }
    /* Toggle switch */
    .toggle-wrap { position: relative; display: inline-block; width: 40px; height: 22px; flex-shrink: 0; }
    .toggle-wrap input { opacity: 0; width: 0; height: 0; }
    .toggle-track { position: absolute; cursor: pointer; inset: 0; background: #1e2d45;
                    border-radius: 22px; transition: 0.2s; }
    .toggle-track:before { content: ''; position: absolute; height: 16px; width: 16px;
                           left: 3px; bottom: 3px; background: #475569; border-radius: 50%; transition: 0.2s; }
    input:checked + .toggle-track { background: #1d4ed8; }
    input:checked + .toggle-track:before { transform: translateX(18px); background: white; }
    /* Customize drawer */
    .drawer-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 99;
                       opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .customize-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 288px;
                        background: #0c1525; border-left: 1px solid #1e2d45; z-index: 100;
                        transform: translateX(100%); transition: transform 0.25s ease; overflow-y: auto; }
    .customize-drawer.open { transform: translateX(0); }
    /* Symbol bar */
    .sym-bar-track { background: #1a2540; border-radius: 4px; height: 8px; overflow: hidden; }
    .sym-bar-fill  { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
    /* Toggle row icon */
    .toggle-icon { transition: transform 0.2s; display: inline-block; color: #475569; }
    .toggle-icon.closed { transform: rotate(-90deg); }
    /* Horizontal rule in drawer */
    .drawer-rule { border: none; border-top: 1px solid #1e2d45; margin: 0; }
    /* Sources drawer */
    .sources-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 320px;
                      background: #0c1525; border-left: 1px solid #1e2d45; z-index: 100;
                      transform: translateX(100%); transition: transform 0.25s ease;
                      display: flex; flex-direction: column; }
    .sources-drawer.open { transform: translateX(0); }
    /* Connect button — premium pill */
    .connect-btn { background: #0d1e38; border: 1px solid #2a3f5f; border-radius: 8px;
                   padding: 5px 13px; font-size: 12px; font-weight: 700; color: #60a5fa;
                   cursor: pointer; transition: all 0.15s; white-space: nowrap; letter-spacing: 0.01em; }
    .connect-btn:hover { background: #112340; border-color: #3b82f6; color: #93c5fd;
                         box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
    /* CSV drop zone */
    .dropzone { border: 2px dashed #1a2d42; border-radius: 10px; padding: 20px 16px;
                text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s;
                background: #080d1a; }
    .dropzone:hover, .dropzone.drag-over { border-color: #3b82f6; background: #080f20; }
    /* Broker tile */
    .broker-tile { background: #09162a; border: 1px solid #192c42; border-radius: 12px;
                   padding: 14px 16px; display: flex; align-items: center; gap: 13px;
                   transition: border-color 0.15s; }
    .broker-tile.live:hover { border-color: #2a3f5f; }
    /* Sign-in CTA on broker tile */
    .sign-in-btn { display: flex; align-items: center; gap: 5px; padding: 6px 13px;
                   background: rgba(29,78,216,0.13); border: 1px solid rgba(59,130,246,0.28);
                   border-radius: 8px; color: #60a5fa; font-size: 11px; font-weight: 700;
                   cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
    .sign-in-btn:hover { background: rgba(29,78,216,0.22); border-color: #3b82f6; color: #93c5fd; }
    /* Coming-soon badge on broker tile */
    .soon-badge { padding: 4px 10px; background: transparent; border: 1px solid #1a2d42;
                  border-radius: 6px; color: #2d4060; font-size: 10px; font-weight: 700;
                  letter-spacing: 0.07em; white-space: nowrap; flex-shrink: 0; }
    /* Chart expand */
    #barPane, #linePane { transition: height 0.28s ease; }
    .chart-expanded #barPane, .chart-expanded #linePane { height: 280px !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* Show-more footer */
    .show-more-row { text-align: center; padding: 9px; border-top: 1px solid #1e2d45; }
    .show-more-btn { background: none; border: 1px solid #1e2d45; border-radius: 8px;
                     padding: 5px 18px; font-size: 12px; color: #64748b; cursor: pointer;
                     transition: all 0.15s; }
    .show-more-btn:hover { border-color: #2d4060; color: #94a3b8; }
  </style>
</head>
<body>

<!-- ── BACKDROP (shared) ── -->
<div class="drawer-backdrop" id="backdrop" onclick="closeAllDrawers()"></div>

<!-- ── CUSTOMIZE DRAWER ── -->
<div class="customize-drawer" id="customizeDrawer">
  <div style="padding:18px 20px;border-bottom:1px solid #1e2d45;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-size:15px;font-weight:700;color:#f1f5f9;">Customize Dashboard</div>
    <button onclick="closeCustomize()" style="background:none;border:none;color:#475569;font-size:18px;cursor:pointer;line-height:1;">✕</button>
  </div>
  <div style="padding:12px 0;" id="widgetList"></div>
  <div style="padding:16px 20px;border-top:1px solid #1e2d45;">
    <button onclick="resetWidgets()"
      style="width:100%;padding:8px;background:transparent;border:1px solid #1e2d45;border-radius:8px;
             color:#475569;font-size:13px;cursor:pointer;transition:all 0.15s;"
      onmouseover="this.style.borderColor='#2d4060';this.style.color='#94a3b8'"
      onmouseout="this.style.borderColor='#1e2d45';this.style.color='#475569'">
      Reset to Defaults
    </button>
  </div>
</div>

<!-- ── SOURCES DRAWER ── -->
<div class="sources-drawer" id="sourcesDrawer">
  <div style="padding:20px 22px 16px;border-bottom:1px solid #1a2d42;flex-shrink:0;
              background:linear-gradient(180deg,#0c1829 0%,#0c1525 100%);">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div>
        <div style="font-size:15px;font-weight:800;color:#f1f5f9;letter-spacing:-0.01em;">Connect Accounts</div>
        <div style="font-size:11px;color:#3d5a7a;margin-top:3px;">Sync trades &amp; positions automatically</div>
      </div>
      <button onclick="closeAllDrawers()" style="background:none;border:none;color:#334155;font-size:18px;
              cursor:pointer;line-height:1;padding:2px 0 0 8px;transition:color 0.15s;"
              onmouseover="this.style.color='#64748b'" onmouseout="this.style.color='#334155'">✕</button>
    </div>
  </div>
  <div style="overflow-y:auto;flex:1;padding-bottom:28px;" id="sourcesList"></div>
</div>

<!-- ── HEADER ── -->
<div style="background:#080d1a;border-bottom:1px solid #1e2d45;padding:10px 20px;position:sticky;top:0;z-index:10;">
  <div style="max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:baseline;gap:6px;">
      <span style="font-size:20px;font-weight:800;color:#f1f5f9;">Option</span><span style="font-size:20px;font-weight:800;color:#3b82f6;">Flow</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="font-size:10px;color:#334155;" id="lastSync">Never synced</div>

      <button class="connect-btn" onclick="openConnectors()" title="Connect broker accounts">
        <svg style="display:inline;vertical-align:-1px;" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M10 2l4 4-4 4M6 14l-4-4 4-4"/></svg>
        Connect</button>
      <button class="gear-btn" onclick="openCustomize()" title="Customize dashboard">⚙</button>
    </div>
  </div>
</div>

<!-- ── MAIN ── -->
<div style="max-width:900px;margin:0 auto;padding:14px 16px 40px;">

      <button class="pill active" onclick="setPeriod('YTD')" data-period="YTD">YTD</button>
      <button class="pill"        onclick="setPeriod('1Y')"  data-period="1Y">1Y</button>
      <button class="pill"        onclick="setPeriod('ALL')" data-period="ALL">All</button>
    </div>
  </div>

  <div id="w-perf-cards" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;" id="perfCards"></div>

  </div>

      <span style="flex:1;"></span>
      <button id="expandChartBtn" onclick="toggleChartExpand()" title="Expand chart"

                     font-size:15px;line-height:1;transition:color 0.15s;"
              onmouseover="this.style.color='#94a3b8'" onmouseout="this.style.color='#475569'">⊞</button>
    </div>
    <div style="padding:16px;">
      <div id="barPane"  style="position:relative;height:175px;"><canvas id="barChart"></canvas></div>
      <div id="linePane" style="position:relative;height:175px;display:none;"><canvas id="lineChart"></canvas></div>
    </div>
  </div>

  <!-- Widget: open-pos -->
  <div id="w-open-pos" class="card" style="margin-bottom:16px;">
    <div style="padding:13px 18px;border-bottom:1px solid #1e2d45;display:flex;justify-content:space-between;align-items:center;">
      <div style="font-size:14px;font-weight:700;color:#cbd5e1;">Open Positions</div>
      <div style="font-size:12px;color:#475569;" id="openCount"></div>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Type</th>
            <th>Strike / Exp</th>
            <th>Acct</th>
            <th style="text-align:right;">DTE</th>
            <th style="text-align:right;">At Risk</th>
          </tr>
        </thead>
        <tbody id="openBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Widget: trade-log -->
  <div id="w-trade-log" class="card">
    <div style="padding:13px 18px;border-bottom:1px solid #1e2d45;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;"
         onclick="toggleTrades()">
      <div style="font-size:14px;font-weight:700;color:#cbd5e1;">Trade Log</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:12px;color:#475569;" id="tradeCount"></span>
        <span class="toggle-icon" id="tradeToggle">▾</span>
      </div>
    </div>
    <div id="tradePanel">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Opened</th>
              <th>Symbol</th>
              <th>Type</th>
              <th>Strike / Exp</th>
              <th>Acct</th>
              <th>Status</th>
              <th style="text-align:right;">Cash Flow</th>
            </tr>
          </thead>
          <tbody id="tradeBody"></tbody>
        </table>
      </div>
      <div id="tradeShowMore"></div>
    </div>
  </div>

  <div style="text-align:center;font-size:11px;color:#1e2d45;margin-top:24px;">
    POC · Mock Data · TastyTrade live sync coming next
  </div>
</div>

// ── CSV import ────────────────────────────────────────────────
function handleDragOver(e)  { e.preventDefault(); document.getElementById('dropzone').classList.add('drag-over'); }
function handleDragLeave()  { document.getElementById('dropzone').classList.remove('drag-over'); }
function handleCsvDrop(e)   { e.preventDefault(); handleDragLeave(); handleCsvFile(e.dataTransfer.files[0]); }
function handleCsvFile(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = e => processCsvText(e.target.result);
  r.readAsText(file);
}
function processCsvText(text) {
  const result = parseCsvImport(text);
  const preview = document.getElementById('importPreview');
  const actions = document.getElementById('importActions');
  preview.style.display = 'block';
  if (result.error) {
    pendingImport = null;
    preview.innerHTML = `<span style="color:#ef4444;">⚠ ${result.error}</span>`;
    actions.style.display = 'none';
    return;
  }
  pendingImport = result.trades;
  const dates = result.trades.map(t => t.date).sort();
  const range = dates.length > 1 ? ` · ${dates[0]} → ${dates[dates.length - 1]}` : '';
  const warn  = result.warnings && result.warnings.length
    ? `<div style="color:#f59e0b;margin-top:3px;">⚠ ${result.warnings.length} row(s) skipped</div>` : '';
  preview.innerHTML = `<span style="color:#10b981;font-weight:600;">✓ Found ${result.trades.length} trades${range}</span>${warn}`;
  actions.style.display = 'flex';
  actions.innerHTML = `
    <button onclick="confirmImport()"
            style="flex:1;padding:7px;background:#1d4ed8;border:none;border-radius:8px;
                   color:#fff;font-size:12px;font-weight:600;cursor:pointer;">Import Trades</button>
    <button onclick="cancelImport()"
            style="padding:7px 13px;background:transparent;border:1px solid #1e2d45;border-radius:8px;
                   color:#475569;font-size:12px;cursor:pointer;">Cancel</button>`;
}
function parseCsvImport(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return { error: 'Empty file' };
  const header  = lines[0].toLowerCase().split(',').map(h => h.trim().replace(/["']/g, ''));
  const required = ['date','sym','strategy','strike','exp','contracts','sto','btc','status','acct'];
  const missing  = required.filter(r => !header.includes(r));
  if (missing.length) return { error: `Missing columns: ${missing.join(', ')}` };
  const idx = name => header.indexOf(name);
  const trades = [], errs = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.trim().replace(/["']/g, ''));
    if (cols.every(c => !c)) continue;
    try {
      const t = {
        id: Date.now() + i, date: cols[idx('date')],
        sym: cols[idx('sym')].toUpperCase(), strategy: cols[idx('strategy')].toUpperCase(),
        strike: +cols[idx('strike')], exp: cols[idx('exp')],
        contracts: +cols[idx('contracts')] || 1, sto: +cols[idx('sto')] || 0,
        btc: +cols[idx('btc')] || 0, status: cols[idx('status')].toLowerCase(),
        acct: cols[idx('acct')].toLowerCase(),
      };
      if (!t.sym || !t.date || !t.strategy) { errs.push(`Row ${i + 1}: missing required field`); continue; }
      trades.push(t);
    } catch { errs.push(`Row ${i + 1}: parse error`); }
  }
  if (!trades.length) return { error: errs.length ? errs[0] : 'No valid trades found' };
  return { trades, warnings: errs };
}
function confirmImport() {
  if (!pendingImport || !pendingImport.length) return;
  const count = pendingImport.length;
  TRADES.push(...pendingImport);
  pendingImport = null;
  document.getElementById('importActions').style.display = 'none';
  document.getElementById('importPreview').innerHTML =
    `<span style="color:#10b981;font-weight:700;">✓ ${count} trades imported!</span>`;
  render();
  setTimeout(() => closeAllDrawers(), 1200);
}
function cancelImport() {
  pendingImport = null;
  document.getElementById('importPreview').style.display = 'none';
  document.getElementById('importActions').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const TODAY = new Date('2026-03-02');

function cashFlow(t)    { return t.status !== 'open' ? (t.sto - t.btc) * t.contracts * 100 : null; }
function openPremium(t) { return t.status === 'open'  ? t.sto * t.contracts * 100 : null; }

function fmt(n, decimals = 0) {
  const abs = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return n < 0 ? `-$${abs}` : `$${abs}`;
}

function periodStart(p) {
  const d = new Date(TODAY);
  if (p === '1M')  { d.setMonth(d.getMonth() - 1); return d; }
  if (p === '3M')  { d.setMonth(d.getMonth() - 3); return d; }
  if (p === 'YTD') return new Date('2026-01-01');
  if (p === '1Y')  { d.setFullYear(d.getFullYear() - 1); return d; }
  return new Date('2000-01-01');
}

function monthsInPeriod(p) {
  if (p === '1M')  return 1;
  if (p === '3M')  return 3;
  if (p === 'YTD') return TODAY.getMonth() + 1;
  if (p === '1Y')  return 12;
  return null;
}

function calcDTE(expStr) {
  // 'MM/DD' → assume current or next cycle year
  const [m, d] = expStr.split('/').map(Number);
  let yr = TODAY.getFullYear();
  const exp = new Date(yr, m - 1, d);
  if (exp < TODAY) exp.setFullYear(yr + 1);
  return Math.ceil((exp - TODAY) / 86400000);
}

function filtered() {
  const start = periodStart(selPeriod);
  return TRADES.filter(t => {
    const matchAcct = selAccount === 'all' || t.acct === selAccount;
    const matchDate = new Date(t.date) >= start;
    return matchAcct && matchDate;
  });
}

// ═══════════════════════════════════════════════════════════
// WIDGET: KEY STATS
// ═══════════════════════════════════════════════════════════
function renderKeyStats(trades) {
  const closed  = trades.filter(t => t.status !== 'open');
  const open    = trades.filter(t => t.status === 'open');
  const totalCF = closed.reduce((s, t) => s + cashFlow(t), 0);
  const totalOP = open.reduce((s, t) => s + openPremium(t), 0);

  let mo = monthsInPeriod(selPeriod);
  if (!mo) { const keys = new Set(closed.map(t => t.date.slice(0,7))); mo = keys.size || 1; }
  const avg = Math.round(totalCF / mo);

  const thisMonStart = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  const thisMo = closed.filter(t => new Date(t.date) >= thisMonStart)
                       .reduce((s, t) => s + cashFlow(t), 0);
  const thisMonLabel = TODAY.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const cards = [];
  if (statPrefs.has('stat-total-cf')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">Total Cash Flow</div>
      <div style="font-size:26px;font-weight:800;" class="positive">${fmt(totalCF)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">${closed.length} closed trades</div>
    </div>`);
  if (statPrefs.has('stat-this-month')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">This Month</div>
      <div style="font-size:26px;font-weight:800;" class="${thisMo >= 0 ? 'positive' : 'negative'}">${fmt(thisMo)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">${thisMonLabel}</div>
    </div>`);
  if (statPrefs.has('stat-open-prem')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">Open Premium</div>
      <div style="font-size:26px;font-weight:800;color:#f59e0b;">${fmt(totalOP)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">${open.length} position${open.length!==1?'s':''}</div>
    </div>`);
  if (statPrefs.has('stat-avg-month')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">Avg / Month</div>
      <div style="font-size:26px;font-weight:800;color:#60a5fa;">${fmt(avg)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">Over ${mo} month${mo!==1?'s':''}</div>
    </div>`);

  const el = document.getElementById('w-key-stats');
  el.innerHTML = cards.join('');
  el.style.display = cards.length ? 'grid' : 'none';
}

// ═══════════════════════════════════════════════════════════
// WIDGET: PERFORMANCE CARDS
// ═══════════════════════════════════════════════════════════
function renderPerfCards(trades) {
  const closed = trades.filter(t => t.status !== 'open');
  if (!closed.length) {
    document.getElementById('w-perf-cards').innerHTML =
      `<div class="card" style="padding:16px;grid-column:1/-1;text-align:center;color:#334155;">No closed trades in period</div>`;
    return;
  }

  // Win rate: expired or closed with profit
  const wins   = closed.filter(t => t.status === 'expired' || cashFlow(t) > 0);
  const losses = closed.filter(t => cashFlow(t) <= 0 && t.status !== 'rolled');
  const winRate = Math.round((wins.length / closed.length) * 100);

  // Premium capture: avg (STO - BTC) / STO
  const captures = closed
    .filter(t => t.sto > 0)
    .map(t => (t.sto - t.btc) / t.sto * 100);
  const avgCapture = Math.round(captures.reduce((s, v) => s + v, 0) / captures.length);

  // Best month
  const monthly = {};
  closed.forEach(t => {
    const k = t.date.slice(0, 7);
    monthly[k] = (monthly[k] || 0) + cashFlow(t);
  });
  const bestMo = Math.max(...Object.values(monthly));
  const bestMoKey = Object.keys(monthly).find(k => monthly[k] === bestMo);
  const bestLabel = bestMoKey
    ? new Date(bestMoKey + '-01').toLocaleDateString('en-US', { month: 'short', year: '2-digit' })
    : '—';

  // Profit factor: gross wins / |gross losses|
  const grossWin  = wins.reduce((s, t) => s + Math.max(cashFlow(t), 0), 0);
  const grossLoss = Math.abs(losses.reduce((s, t) => s + Math.min(cashFlow(t), 0), 0));
  const pf = grossLoss > 0 ? (grossWin / grossLoss).toFixed(1) : '∞';

  const cards = [];
  if (statPrefs.has('stat-win-rate')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">Win Rate</div>
      <div style="font-size:26px;font-weight:800;color:${winRate>=70?'#10b981':'#f59e0b'};">${winRate}%</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">${wins.length}W · ${losses.length}L · ${closed.length - wins.length - losses.length} rolled</div>
    </div>`);
  if (statPrefs.has('stat-capture')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">Avg Capture</div>
      <div style="font-size:26px;font-weight:800;color:#a78bfa;">${avgCapture}%</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">Of premium collected</div>
    </div>`);
  if (statPrefs.has('stat-best-month')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">Best Month</div>
      <div style="font-size:26px;font-weight:800;" class="positive">${fmt(bestMo)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">${bestLabel}</div>
    </div>`);
  if (statPrefs.has('stat-pf')) cards.push(`
    <div class="card" style="padding:16px;">
      <div class="stat-label">Profit Factor</div>
      <div style="font-size:26px;font-weight:800;color:#f97316;">${pf}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">Gross win / gross loss</div>
    </div>`);

  const el = document.getElementById('w-perf-cards');
  el.innerHTML = cards.join('');
  el.style.display = cards.length ? 'grid' : 'none';
}

// ═══════════════════════════════════════════════════════════
// WIDGET: INCOME BY SYMBOL
// ═══════════════════════════════════════════════════════════
function renderBySymbol(trades) {
  const closed = trades.filter(t => t.status !== 'open');
  const bySymbol = {};
  closed.forEach(t => {
    bySymbol[t.sym] = (bySymbol[t.sym] || 0) + cashFlow(t);
  });
  const sorted = Object.entries(bySymbol).sort((a, b) => b[1] - a[1]);
  if (!sorted.length) {
    document.getElementById('symbolBars').innerHTML =
      '<div style="color:#334155;font-size:12px;">No data in period</div>';
    return;
  }
  const max = Math.abs(sorted[0][1]);
  document.getElementById('symbolBars').innerHTML = sorted.map(([sym, val]) => {
    const pct  = Math.round(Math.abs(val) / max * 100);
    const pos  = val >= 0;
    const color = pos ? '#10b981' : '#ef4444';
    return `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div style="width:46px;font-size:12px;font-weight:700;color:#94a3b8;flex-shrink:0;">${sym}</div>
        <div style="flex:1;">
          <div class="sym-bar-track">
            <div class="sym-bar-fill" style="width:${pct}%;background:${color};"></div>
          </div>
        </div>
        <div style="width:64px;text-align:right;font-size:12px;font-weight:700;color:${color};">${fmt(val)}</div>
      </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════
// WIDGET: CHARTS
// ═══════════════════════════════════════════════════════════
function renderCharts(trades) {
  const closed = trades.filter(t => t.status !== 'open');
  const monthly = {};
  closed.forEach(t => {
    const key = t.date.slice(0, 7);
    monthly[key] = (monthly[key] || 0) + cashFlow(t);
  });
  const keys = Object.keys(monthly).sort();

  const noData = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#334155;font-size:13px;">No closed trades in this period</div>`;
  if (!keys.length) {
    document.getElementById('barPane').innerHTML  = noData;
    document.getElementById('linePane').innerHTML = noData;
    return;
  }

  const labels = keys.map(k => {
    const [y, m] = k.split('-');
    return new Date(+y, +m - 1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
  });
  const values = keys.map(k => monthly[k]);
  let running = 0;
  const cumul = values.map(v => { running += v; return running; });
  const N = values.length;

  // ── Bar chart (pure SVG, no library) ───────────────────────
  const COL   = 52;
  const BAR_H = 96;
  const VAL_H = 14;
  const LBL_H = 18;
  const bvW   = N * COL + 8;
  const bvH   = VAL_H + BAR_H + LBL_H;
  const maxAbs = Math.max(...values.map(Math.abs), 1);

  const bars = values.map((v, i) => {
    const x   = 4 + i * COL + COL * 0.12;
    const bw  = COL * 0.76;
    const bh  = Math.max(2, Math.round(Math.abs(v) / maxAbs * BAR_H * 0.9));
    const by  = VAL_H + BAR_H - bh;
    const cx  = x + bw / 2;
    const col = v >= 0 ? '#10b981' : '#ef4444';
    const absV = Math.abs(v);
    const vStr = absV >= 1000 ? `${v < 0 ? '-' : ''}$${(absV / 1000).toFixed(1)}k` : fmt(v);
    return `<rect x="${x}" y="${by}" width="${bw}" height="${bh}" fill="${col}" opacity="0.8" rx="2"/>
      <text x="${cx}" y="${VAL_H - 2}" text-anchor="middle" font-size="9" fill="${col}" font-weight="600">${vStr}</text>
      <text x="${cx}" y="${VAL_H + BAR_H + LBL_H - 3}" text-anchor="middle" font-size="9" fill="#475569">${labels[i]}</text>`;
  }).join('');

  document.getElementById('barPane').innerHTML =
    `<svg viewBox="0 0 ${bvW} ${bvH}" style="width:100%;height:100%;" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;

  // ── Cumulative line chart (pure SVG) ────────────────────────
  const W = 420, H = 130;
  const pL = 44, pR = 8, pT = 10, pB = 22;
  const plotW = W - pL - pR;
  const plotH = H - pT - pB;
  const minC = Math.min(0, ...cumul);
  const maxC = Math.max(...cumul, 1);
  const rng  = maxC - minC || 1;
  const xF = i => pL + (N > 1 ? (i / (N - 1)) * plotW : plotW / 2);
  const yF = v => pT + plotH - ((v - minC) / rng) * plotH;

  const pts  = cumul.map((v, i) => `${xF(i)},${yF(v)}`).join(' ');
  const area = `M${xF(0)},${yF(cumul[0])}${cumul.map((v, i) => ` L${xF(i)},${yF(v)}`).join('')} L${xF(N - 1)},${pT + plotH} L${xF(0)},${pT + plotH}Z`;

  const gridLines = [0, 0.5, 1].map(t => {
    const v = minC + t * rng;
    const y = yF(v);
    const lbl = Math.abs(v) >= 1000 ? `$${(v / 1000).toFixed(1)}k` : fmt(v);
    return `<line x1="${pL}" y1="${y}" x2="${W - pR}" y2="${y}" stroke="#1a2540" stroke-width="0.5"/>
      <text x="${pL - 3}" y="${y}" text-anchor="end" font-size="8" fill="#475569" dominant-baseline="middle">${lbl}</text>`;
  }).join('');

  const dots   = cumul.map((v, i) => `<circle cx="${xF(i)}" cy="${yF(v)}" r="3" fill="#3b82f6"/>`).join('');
  const xLbls  = labels.map((l, i) => `<text x="${xF(i)}" y="${H - 4}" text-anchor="middle" font-size="8" fill="#475569">${l}</text>`).join('');

  document.getElementById('linePane').innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:100%;" preserveAspectRatio="xMidYMid meet">
      ${gridLines}
      <path d="${area}" fill="rgba(59,130,246,0.1)"/>
      <polyline points="${pts}" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linejoin="round"/>
      ${dots}${xLbls}
    </svg>`;
}

// ═══════════════════════════════════════════════════════════
// WIDGET: OPEN POSITIONS
// ═══════════════════════════════════════════════════════════
function renderOpenPos(trades) {
  const open = trades.filter(t => t.status === 'open');
  document.getElementById('openCount').textContent = `${open.length} position${open.length !== 1 ? 's' : ''}`;

  if (!open.length) {
    document.getElementById('openBody').innerHTML =
      `<tr><td colspan="6" style="text-align:center;color:#334155;padding:24px;">No open positions</td></tr>`;
    return;
  }
  const rows = open.map(t => {
    const dte   = calcDTE(t.exp);
    const risk  = openPremium(t);
    const acct  = t.acct === 'individual' ? '···1234' : '···5678';
    const dteCls = dte <= 7 ? 'color:#ef4444;font-weight:700;' : dte <= 14 ? 'color:#f59e0b;font-weight:600;' : 'color:#60a5fa;';
    const strat = `<span class="badge b-gray">${t.strategy}</span>`;
    return `<tr>
      <td><div style="font-weight:700;">${t.sym}</div></td>
      <td>${strat}</td>
      <td><div style="font-weight:600;">${t.strike}${t.strategy==='CC'?'C':'P'}</div>
          <div style="font-size:11px;color:#475569;">${t.exp}</div></td>
      <td style="font-size:12px;color:#64748b;">${acct}</td>
      <td style="text-align:right;${dteCls}">${dte}d</td>
      <td style="text-align:right;font-weight:700;color:#f59e0b;">${fmt(risk)}</td>
    </tr>`;
  }).join('');
  document.getElementById('openBody').innerHTML = rows;
}

// ═══════════════════════════════════════════════════════════
// WIDGET: TRADE LOG
// ═══════════════════════════════════════════════════════════
const BADGE = {
  expired: ['b-green',  'Expired ✓'],
  closed:  ['b-blue',   'Closed'],
  rolled:  ['b-yellow', 'Rolled'],
  open:    ['b-gray',   'Open'],
};

function renderTradeLog(trades) {
  const sorted  = [...trades].sort((a, b) => new Date(b.date) - new Date(a.date));
  const total   = sorted.length;
  document.getElementById('tradeCount').textContent = `${total} trades`;

  const visible = tradeLogExpanded ? sorted : sorted.slice(0, TRADE_LOG_LIMIT);
  const hidden  = total - visible.length;

  const rows = visible.map(t => {
    const cf  = cashFlow(t);
    const op  = openPremium(t);
    const val = cf !== null
      ? `<span class="${cf >= 0 ? 'positive' : 'negative'}" style="font-weight:700;">${fmt(cf)}</span>`
      : `<span style="color:#f59e0b;font-weight:700;">${fmt(op)}</span>`;
    const [bc, bl] = BADGE[t.status] || BADGE.open;
    const acct    = t.acct === 'individual' ? '···1234' : '···5678';
    const dateStr = new Date(t.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    return `<tr>
      <td><div style="font-weight:600;font-size:13px;">${dateStr}</div></td>
      <td><div style="font-weight:700;">${t.sym}</div></td>
      <td><span class="badge b-gray">${t.strategy}</span></td>
      <td><div style="font-weight:600;">${t.strike}${t.strategy==='CC'?'C':'P'}</div>
          <div style="font-size:11px;color:#475569;">${t.exp}</div></td>
      <td style="font-size:12px;color:#64748b;">${acct}</td>
      <td><span class="badge ${bc}">${bl}</span></td>
      <td style="text-align:right;">${val}</td>
    </tr>`;
  }).join('');

  document.getElementById('tradeBody').innerHTML = rows ||
    `<tr><td colspan="7" style="text-align:center;color:#334155;padding:30px;">No trades in this period</td></tr>`;

  const footer = document.getElementById('tradeShowMore');
  if (hidden > 0) {
    footer.innerHTML = `<div class="show-more-row">
      <button class="show-more-btn" onclick="setTradeLogExpanded(true)">Show ${hidden} more</button>
    </div>`;
  } else if (tradeLogExpanded && total > TRADE_LOG_LIMIT) {
    footer.innerHTML = `<div class="show-more-row">
      <button class="show-more-btn" onclick="setTradeLogExpanded(false)">Show less</button>
    </div>`;
  } else {
    footer.innerHTML = '';
  }
}
function setTradeLogExpanded(on) {
  tradeLogExpanded = on;
  renderTradeLog(filtered());
}

// ═══════════════════════════════════════════════════════════
// RENDER ALL
// ═══════════════════════════════════════════════════════════
function render() {
  const trades = filtered();
  if (widgetPrefs.has('key-stats'))  renderKeyStats(trades);
  if (widgetPrefs.has('perf-cards')) renderPerfCards(trades);
  if (widgetPrefs.has('by-symbol'))  renderBySymbol(trades);
  if (widgetPrefs.has('charts'))     renderCharts(trades);
  if (widgetPrefs.has('open-pos'))   renderOpenPos(trades);
  if (widgetPrefs.has('trade-log'))  renderTradeLog(trades);
}

document.addEventListener('DOMContentLoaded', () => {
  applyPrefs();
  render();
});

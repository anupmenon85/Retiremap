<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>OptionFlow — Options Income Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #080d1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
      min-height: 100vh;
    }
    .card {
      background: #111827;
      border: 1px solid #1e2d45;
      border-radius: 14px;
    }
    /* Time-period pills */
    .pill {
      border-radius: 20px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .pill.active          { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .pill:not(.active)    { background: #111827; color: #94a3b8; border-color: #1e2d45; }
    /* Account segmented control */
    .seg-btn {
      padding: 4px 12px; font-size: 12px; font-weight: 500;
      cursor: pointer; background: transparent;
      color: #475569; border: 1px solid #1e2d45;
      transition: all 0.15s; white-space: nowrap;
    }
    .seg-btn:first-child             { border-radius: 8px 0 0 8px; }
    .seg-btn:last-child              { border-radius: 0 8px 8px 0; }
    .seg-btn:not(:first-child)       { border-left: none; }
    .seg-btn.active                  { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
    .seg-btn.active + .seg-btn       { border-left-color: #1d4ed8; }
    /* Chart tabs */
    .chart-tab {
      padding: 8px 16px; font-size: 12px; font-weight: 600;
      cursor: pointer; border: none; background: none;
      color: #475569; border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .chart-tab.active { color: #60a5fa; border-bottom-color: #3b82f6; }
    /* Misc */
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: #475569; margin-bottom: 4px; }
    .positive { color: #10b981; }
    .negative { color: #ef4444; }
    table { width: 100%; border-collapse: collapse; }
    th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #475569;
         padding: 10px 14px; text-align: left; border-bottom: 1px solid #1e2d45; }
    td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid #0d1626; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #141e31; }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 5px; font-weight: 600; display: inline-block; }
    .b-green  { background: #052e1c; color: #10b981; }
    .b-blue   { background: #0c2044; color: #60a5fa; }
    .b-yellow { background: #2d1a02; color: #f59e0b; }
    .b-gray   { background: #1a2336; color: #94a3b8; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 4px; }
    .sync-btn {
      background: #1d4ed8; color: white; border: none;
      padding: 6px 14px; border-radius: 8px; font-size: 13px;
      font-weight: 600; cursor: pointer; transition: background 0.15s;
    }
    .sync-btn:hover    { background: #2563eb; }
    .sync-btn:disabled { background: #1e3a6e; color: #4b6cb7; cursor: default; }
    .toggle-icon { transition: transform 0.2s; display: inline-block; }
    .toggle-icon.closed { transform: rotate(-90deg); }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<div style="background:#080d1a;border-bottom:1px solid #1e2d45;padding:10px 20px;position:sticky;top:0;z-index:10;">
  <div style="max-width:860px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:baseline;gap:6px;">
      <span style="font-size:20px;font-weight:800;color:#f1f5f9;">Option</span><span style="font-size:20px;font-weight:800;color:#3b82f6;">Flow</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="font-size:10px;color:#334155;" id="lastSync">Never synced</div>
      <button class="sync-btn" onclick="handleSync()" id="syncBtn">↻ Sync</button>
    </div>
  </div>
</div>

<!-- ── MAIN ── -->
<div style="max-width:860px;margin:0 auto;padding:14px 16px 40px;">

  <!-- ── Combined Filter Row ── -->
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:16px;">
    <!-- Account segmented control -->
    <div style="display:flex;" id="accountFilters">
      <button class="seg-btn active" onclick="setAccount('all')"        data-account="all">All</button>
      <button class="seg-btn"        onclick="setAccount('individual')" data-account="individual">···1234</button>
      <button class="seg-btn"        onclick="setAccount('ira')"        data-account="ira">IRA ···5678</button>
    </div>
    <!-- Time period pills -->
    <div style="display:flex;gap:5px;" id="timeFilters">
      <button class="pill"        onclick="setPeriod('1M')"  data-period="1M">1M</button>
      <button class="pill"        onclick="setPeriod('3M')"  data-period="3M">3M</button>
      <button class="pill active" onclick="setPeriod('YTD')" data-period="YTD">YTD</button>
      <button class="pill"        onclick="setPeriod('1Y')"  data-period="1Y">1Y</button>
      <button class="pill"        onclick="setPeriod('ALL')" data-period="ALL">All</button>
    </div>
  </div>

  <!-- ── Summary Cards ── -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;" id="summaryCards"></div>

  <!-- ── Tabbed Chart Card ── -->
  <div class="card" style="margin-bottom:18px;">
    <div style="display:flex;border-bottom:1px solid #1e2d45;padding:0 14px;">
      <button class="chart-tab active" id="tabBar"  onclick="setChartTab('bar')">Monthly Cash Flow</button>
      <button class="chart-tab"        id="tabLine" onclick="setChartTab('line')">Cumulative</button>
    </div>
    <div style="padding:16px;">
      <div id="barPane"  style="position:relative;height:175px;"><canvas id="barChart"></canvas></div>
      <div id="linePane" style="position:relative;height:175px;display:none;"><canvas id="lineChart"></canvas></div>
    </div>
  </div>

  <!-- ── Trade Log (collapsible) ── -->
  <div class="card">
    <div style="padding:13px 18px;border-bottom:1px solid #1e2d45;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;"
         onclick="toggleTrades()">
      <div style="font-size:14px;font-weight:700;color:#cbd5e1;">Trade Log</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:12px;color:#475569;" id="tradeCount"></span>
        <span class="toggle-icon" id="tradeToggle">▾</span>
      </div>
    </div>
    <div id="tradePanel">
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr>
              <th>Opened</th>
              <th>Position</th>
              <th>Acct</th>
              <th>Status</th>
              <th style="text-align:right;">Cash Flow</th>
            </tr>
          </thead>
          <tbody id="tradeBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div style="text-align:center;font-size:11px;color:#1e2d45;margin-top:24px;">
    POC · Mock Data · TastyTrade live sync coming next
  </div>
</div>

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const TODAY = new Date('2026-03-02');

function cashFlow(t)    { return t.status !== 'open' ? (t.sto - t.btc) * t.contracts * 100 : null; }
function openPremium(t) { return t.status === 'open'  ? t.sto * t.contracts * 100 : null; }

function fmt(n) {
  const abs = Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:0});
  return n < 0 ? `-$${abs}` : `$${abs}`;
}

function periodStart(p) {
  const d = new Date(TODAY);
  if (p === '1M')  { d.setMonth(d.getMonth() - 1); return d; }
  if (p === '3M')  { d.setMonth(d.getMonth() - 3); return d; }
  if (p === 'YTD') return new Date('2026-01-01');
  if (p === '1Y')  { d.setFullYear(d.getFullYear() - 1); return d; }
  return new Date('2000-01-01');
}

function monthsInPeriod(p) {
  if (p === '1M')  return 1;
  if (p === '3M')  return 3;
  if (p === 'YTD') return TODAY.getMonth() + 1;
  if (p === '1Y')  return 12;
  return null;
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let selAccount   = 'all';
let selPeriod    = 'YTD';
let activeChart  = 'bar';
let tradesOpen   = true;
let barInst      = null;
let lineInst     = null;

function filtered() {
  const start = periodStart(selPeriod);
  return TRADES.filter(t => {
    const matchAcct = selAccount === 'all' || t.acct === selAccount;
    const matchDate = new Date(t.date) >= start;
    return matchAcct && matchDate;
  });
}

// ═══════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════
function setAccount(a) {
  selAccount = a;
  document.querySelectorAll('[data-account]').forEach(b =>
    b.classList.toggle('active', b.dataset.account === a));
  render();
}

function setPeriod(p) {
  selPeriod = p;
  document.querySelectorAll('[data-period]').forEach(b =>
    b.classList.toggle('active', b.dataset.period === p));
  render();
}

function setChartTab(tab) {
  activeChart = tab;
  document.getElementById('barPane').style.display  = tab === 'bar'  ? '' : 'none';
  document.getElementById('linePane').style.display = tab === 'line' ? '' : 'none';
  document.getElementById('tabBar').classList.toggle('active',  tab === 'bar');
  document.getElementById('tabLine').classList.toggle('active', tab === 'line');
}

function toggleTrades() {
  tradesOpen = !tradesOpen;
  document.getElementById('tradePanel').style.display = tradesOpen ? '' : 'none';
  document.getElementById('tradeToggle').classList.toggle('closed', !tradesOpen);
}

function handleSync() {
  const btn = document.getElementById('syncBtn');
  btn.textContent = '↻ Syncing…';
  btn.disabled = true;
  setTimeout(() => {
    btn.textContent = '↻ Sync';
    btn.disabled = false;
    const now = new Date();
    document.getElementById('lastSync').textContent =
      'Synced ' + now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
  }, 1800);
}

// ═══════════════════════════════════════════════════════════
// SUMMARY CARDS
// ═══════════════════════════════════════════════════════════
function renderCards(trades) {
  const closed  = trades.filter(t => t.status !== 'open');
  const open    = trades.filter(t => t.status === 'open');
  const totalCF = closed.reduce((s, t) => s + cashFlow(t), 0);
  const totalOP = open.reduce((s, t) => s + openPremium(t), 0);

  let mo = monthsInPeriod(selPeriod);
  if (!mo) {
    const keys = new Set(closed.map(t => t.date.slice(0,7)));
    mo = keys.size || 1;
  }
  const avg = Math.round(totalCF / mo);

  const thisMonStart = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  const thisMo = closed
    .filter(t => new Date(t.date) >= thisMonStart)
    .reduce((s, t) => s + cashFlow(t), 0);

  document.getElementById('summaryCards').innerHTML = `
    <div class="card" style="padding:16px;">
      <div class="stat-label">Total Cash Flow</div>
      <div style="font-size:26px;font-weight:800;" class="positive">${fmt(totalCF)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">${closed.length} closed trades</div>
    </div>
    <div class="card" style="padding:16px;">
      <div class="stat-label">This Month</div>
      <div style="font-size:26px;font-weight:800;" class="positive">${fmt(thisMo)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">March 2026</div>
    </div>
    <div class="card" style="padding:16px;">
      <div class="stat-label">Open Premium</div>
      <div style="font-size:26px;font-weight:800;color:#f59e0b;">${fmt(totalOP)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">${open.length} open position${open.length!==1?'s':''}</div>
    </div>
    <div class="card" style="padding:16px;">
      <div class="stat-label">Avg / Month</div>
      <div style="font-size:26px;font-weight:800;color:#60a5fa;">${fmt(avg)}</div>
      <div style="font-size:11px;color:#334155;margin-top:4px;">Based on ${mo} month${mo!==1?'s':''}</div>
    </div>`;
}

// ═══════════════════════════════════════════════════════════

// ═══════════════════════════════════════════════════════════
function renderCharts(trades) {
  const closed = trades.filter(t => t.status !== 'open');
  const monthly = {};
  closed.forEach(t => {
    const key = t.date.slice(0,7);
    monthly[key] = (monthly[key] || 0) + cashFlow(t);
  });
  const keys   = Object.keys(monthly).sort();
  const labels = keys.map(k => {
    const [y, m] = k.split('-');
    return new Date(+y, +m-1).toLocaleDateString('en-US', {month:'short', year:'2-digit'});
  });
  const values = keys.map(k => monthly[k]);
  let running = 0;
  const cumul = values.map(v => { running += v; return running; });

  Chart.defaults.color       = '#475569';
  Chart.defaults.borderColor = '#1a2540';

  if (barInst)  barInst.destroy();
  if (lineInst) lineInst.destroy();

  const scaleOpts = {
    x: { grid: { display: false }, ticks: { font: { size: 10 } } },
    y: { grid: { color: '#1a2540' }, ticks: { font: { size: 10 }, callback: v => '$' + v.toLocaleString() } }
  };
  const tooltipFmt = { callbacks: { label: ctx => ' ' + fmt(ctx.raw) } };

  barInst = new Chart(document.getElementById('barChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: values.map(v => v >= 0 ? 'rgba(16,185,129,0.65)' : 'rgba(239,68,68,0.65)'),
        borderColor:     values.map(v => v >= 0 ? '#10b981' : '#ef4444'),
        borderWidth: 1, borderRadius: 5,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: tooltipFmt },
      scales: scaleOpts,
    }
  });

  lineInst = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: cumul,
        borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.08)',
        fill: true, tension: 0.35, pointRadius: 3, pointBackgroundColor: '#3b82f6',
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: tooltipFmt },
      scales: scaleOpts,
    }
  });
}

// ═══════════════════════════════════════════════════════════
// TRADE TABLE
// ═══════════════════════════════════════════════════════════
const BADGE = {
  expired: ['b-green',  'Expired ✓'],
  closed:  ['b-blue',   'Closed'],
  rolled:  ['b-yellow', 'Rolled'],
  open:    ['b-gray',   'Open'],
};

function renderTable(trades) {
  const sorted = [...trades].sort((a,b) => new Date(b.date) - new Date(a.date));
  document.getElementById('tradeCount').textContent = `${sorted.length} trades`;

  const rows = sorted.map(t => {
    const cf  = cashFlow(t);
    const op  = openPremium(t);
    const val = cf !== null
      ? `<span class="${cf>=0?'positive':'negative'}" style="font-weight:700;">${fmt(cf)}</span>`
      : `<span style="color:#f59e0b;font-weight:700;">${fmt(op)}</span>`;
    const [bc, bl] = BADGE[t.status] || BADGE.open;
    const acct    = t.acct === 'individual' ? '···1234' : '···5678';
    const desc    = `${t.strike}C  ${t.exp}`;
    const label   = t.contracts > 1 ? `${t.contracts}x CC` : 'CC';
    const dateStr = new Date(t.date).toLocaleDateString('en-US', {month:'short', day:'numeric'});
    return `<tr>
      <td><div style="font-weight:600;font-size:13px;">${dateStr}</div>
          <div style="font-size:10px;color:#334155;">'26 · ${acct}</div></td>
      <td><div style="font-weight:700;">${t.sym}</div>
          <div style="font-size:11px;color:#475569;">${desc}</div></td>
      <td style="font-size:12px;color:#64748b;">${label}</td>
      <td><span class="badge ${bc}">${bl}</span></td>
      <td style="text-align:right;">${val}</td>
    </tr>`;
  }).join('');

  document.getElementById('tradeBody').innerHTML = rows || `
    <tr><td colspan="5" style="text-align:center;color:#334155;padding:30px;">
      No trades in this period
    </td></tr>`;
}

// ═══════════════════════════════════════════════════════════
// RENDER ALL
// ═══════════════════════════════════════════════════════════
function render() {
  const trades = filtered();
  renderCards(trades);
  renderCharts(trades);
  renderTable(trades);
}

document.addEventListener('DOMContentLoaded', render);
</script>
